name: setup-node-input-command-boundary
on:
  workflow_dispatch:
    inputs:
      controlled_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: setup
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.controlled_version }}
          check-latest: false
          package-manager-cache: false
      - name: Exact benign output oracle
        if: always()
        shell: python
        env:
          SETUP_PROBE: ${{ steps.setup.outputs.setup_probe }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          import os
          value = os.environ.get("SETUP_PROBE", "")
          print("SETUP_OUTPUT_PRESENT=" + ("1" if value else "0"))
          print("SETUP_OUTPUT_MATCH=" + ("1" if value == "LIVE" else "0"))
          print("SETUP_STEP_FAILED=" + ("1" if os.environ.get("SETUP_OUTCOME") == "failure" else "0"))
